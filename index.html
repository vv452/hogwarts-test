<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>霍格沃茨分院与专属守护神测试</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui, sans-serif}
body{
  min-height:100vh;
  background:#0b0c1a;
  color:#fff;
  padding:24px;
  display:flex;
  justify-content:center;
  align-items:center;
}
.container{max-width:420px;width:100%}
.page{display:none}
.page.active{display:block}
.card{
  background:rgba(25,28,50,0.85);
  border:1px solid rgba(200,180,255,0.25);
  border-radius:18px;
  padding:28px 24px;
  backdrop-filter:blur(10px);
}
.title{font-size:22px;text-align:center;margin-bottom:12px;color:#e6ddff}
.sub{text-align:center;color:#c9c0e8;margin-bottom:24px;font-size:14px;line-height:1.6}
.question{font-size:17px;line-height:1.7;margin-bottom:24px}
.opt{
  width:100%;
  text-align:left;
  padding:14px 16px;
  margin:10px 0;
  border:1px solid rgba(210,190,255,0.3);
  border-radius:12px;
  background:rgba(40,44,75,0.6);
  color:#fff;
  font-size:15px;
  cursor:pointer;
  transition:0.2s;
}
.opt:hover{background:rgba(90,70,160,0.4);border-color:#b8a1ff}
.next-btn{
  width:100%;
  padding:14px;
  margin-top:20px;
  border-radius:12px;
  border:none;
  background:#7c5cff;
  color:#fff;
  font-size:16px;
  cursor:pointer;
  display:none;
}
.next-btn.show{display:block}
.result-box{text-align:center}
.house-tag{font-size:24px;font-weight:bold;margin:12px 0}
.patronus{font-size:18px;color:#ffdd99;margin-bottom:16px}
.desc{line-height:1.7;color:#e2ddf4;font-size:15px;text-align:left;margin:16px 0}
.wand{margin-top:16px;color:#b8a1ff;font-size:14px}
.restart{
  margin-top:24px;
  padding:12px 20px;
  border-radius:10px;
  border:none;
  background:#443388;
  color:#fff;
  cursor:pointer;
}
.tip{margin-top:18px;font-size:12px;color:#aaa;text-align:center;line-height:1.5}
.end-block{
  text-align:center;
  padding:40px 20px;
}
</style>
</head>
<body>
<div class="container">
  <!-- 封面页 -->
  <div class="page active" id="page0">
    <div class="card">
      <div class="title">🧙‍♂️ 霍格沃茨分院与专属守护神测试</div>
      <div class="sub">魔法部警告：你体内的魔法觉醒，请在这里寻找你的归属与灵魂守护。</div>
      <div style="text-align:center;margin:24px 0">
        <button class="next-btn show" onclick="startTest()">开始测试</button>
      </div>
      <div class="tip">⚠️ 同人趣味测试，仅供娱乐，非官方哈利波特测试</div>
    </div>
  </div>

  <!-- 题目容器 -->
  <div id="questionWrap"></div>

  <!-- 结果页 -->
  <div class="page" id="resultPage">
    <div class="card result-box">
      <div class="title">✨ 你的分院 & 守护神 ✨</div>
      <div class="house-tag" id="houseName"></div>
      <div class="patronus" id="patronusName"></div>
      <div class="desc" id="descText"></div>
      <div class="wand" id="wandText"></div>
      <button class="restart" onclick="restart()">重新测试</button>
      <div class="tip">本测试为同人创作，与华纳、哈利波特官方无关</div>
    </div>
  </div>

  <!-- 已测拦截页 -->
  <div class="page" id="alreadyDone">
    <div class="card end-block">
      <div class="title">🪄 魔法记录已存在</div>
      <div class="sub">这台设备已经召唤过守护神啦，每个人只能进行一次分院仪式</div>
      <button class="restart" onclick="clearRecord()">清除记录重新测</button>
    </div>
  </div>
</div>

<script>
// 每题选项对应学院：G格兰芬多 / H赫奇帕奇 / R拉文克劳 / S斯莱特林
const questions = [
  {
    q:"收到霍格沃茨录取通知书那天，你最想带上什么去学校？",
    o:[
      {txt:"什么都不带，我已经准备好去冒险了",key:"G"},
      {txt:"带上我最喜欢的舒适毛毯和零食",key:"H"},
      {txt:"带一本厚厚的历史书或百科全书",key:"R"},
      {txt:"带上我的小猫/小狗/猫头鹰，它是我的伙伴",key:"S"}
    ]
  },
  {
    q:"分院帽悄悄对你说：你藏着一个秘密，它是？",
    o:[
      {txt:"我害怕的时候也想哭，但我会硬着头皮直面挑战",key:"G"},
      {txt:"我会深夜偷偷溜进厨房，和家养小精灵分享食物",key:"H"},
      {txt:"我喜欢观察、收集别人不知道的冷门知识",key:"R"},
      {txt:"我有很远的目标，希望未来能拥有话语权与力量",key:"S"}
    ]
  },
  {
    q:"霍格沃茨特快上，你更愿意待在哪种车厢？",
    o:[
      {txt:"和大家激烈讨论魁地奇、冒险故事，热闹热血",key:"G"},
      {txt:"和少数挚友安静坐着，分享巧克力蛙卡片",key:"H"},
      {txt:"独自坐在角落看书，沉浸自己的世界",key:"R"},
      {txt:"主动结识不同的人，拓展自己的人脉",key:"S"}
    ]
  },
  {
    q:"在禁林发现一只受伤的神奇动物，你的第一反应？",
    o:[
      {txt:"立刻上前尝试救助，顾不上危险",key:"G"},
      {txt:"先温柔安抚，想办法把它安置好照顾",key:"H"},
      {txt:"保持距离，先查阅资料，弄清楚它是什么",key:"R"},
      {txt:"先环顾四周，确认没有埋伏再行动，谨慎自保",key:"S"}
    ]
  },
  {
    q:"在有求必应屋门口碰到对头，你会？",
    o:[
      {txt:"拔出魔杖，坦然接受决斗，不退缩",key:"G"},
      {txt:"不想冲突，选择避开，不卷入纷争",key:"H"},
      {txt:"好奇起来，提议一起进去探索秘密",key:"R"},
      {txt:"不动声色，想好后续怎么占据上风",key:"S"}
    ]
  },
  {
    q:"你最渴望掌握哪一种魔法？",
    o:[
      {txt:"强大的战斗咒语，用来保护身边的人",key:"G"},
      {txt:"治愈魔法，抚平伤痛，拯救生命",key:"H"},
      {txt:"变形术，探索万物的可能性",key:"R"},
      {txt:"幻影移形，掌握主动权，来去由自己",key:"S"}
    ]
  },
  {
    q:"对你来说，绝对不能妥协的是？",
    o:[
      {txt:"在危难面前背弃正义，临阵退缩",key:"G"},
      {txt:"背叛信任自己的朋友，辜负他人的真心",key:"H"},
      {txt:"停止思考，放弃求知与探索",key:"R"},
      {txt:"任由别人践踏你的尊严与底线",key:"S"}
    ]
  },
  {
    q:"大战来临，你选择的位置是？",
    o:[
      {txt:"冲在前线，直面黑暗，奋勇作战",key:"G"},
      {txt:"留在后方，稳定支援，照顾伤员与同伴",key:"H"},
      {txt:"分析局势，寻找敌人的破绽",key:"R"},
      {txt:"制定计划，抓住关键时机一击制胜",key:"S"}
    ]
  },
  {
    q:"你最喜欢霍格沃茨哪个角落？",
    o:[
      {txt:"格兰芬多塔楼，充满热血与烟火",key:"G"},
      {txt:"黑湖畔草地，安静松弛，适合放空",key:"H"},
      {txt:"图书馆禁书区，藏着无数未知知识",key:"R"},
      {txt:"有求必应屋，只属于自己的秘密基地",key:"S"}
    ]
  },
  {
    q:"如果魔法只能做一件事，你会选择？",
    o:[
      {txt:"勇敢对抗黑暗，守护无辜的人",key:"G"},
      {txt:"善待所有生灵，让弱小者被温柔对待",key:"H"},
      {txt:"解开世界所有未解之谜，追寻真理",key:"R"},
      {txt:"建立属于自己的秩序，掌控自己的命运",key:"S"}
    ]
  }
]

// 学院资料 + 方案1修正后的守护神池
const houseData = {
  G:{
    name:"🦁 格兰芬多",
    title:"勇敢、胆识、正义、无畏",
    patronusPool:[
      "🦌雄鹿","🐎母马","🦊狐狸","🐺狼","🦁狮子","🐶猎狗"
    ],
    desc:"分院帽把你分到格兰芬多。你骨子里拥有狮子般的勇气，不是不害怕，而是恐惧面前依然选择站出来。你重视正义，愿意为守护他人挺身而出，热烈坦荡，是值得信赖的伙伴。",
    wand:"常见适配：冬青木·凤凰羽毛、橡木·独角兽毛"
  },
  H:{
    name:"🦡 赫奇帕奇",
    title:"忠诚、勤勉、善良、公平",
    patronusPool:[
      "🦦水獭","🦡獾","🐰野兔","🦔刺猬","🐦知更鸟","🐐山羊"
    ],
    desc:"你属于赫奇帕奇。很多人低估赫奇帕奇，但这里拥有最真诚、最坚韧的灵魂。你重视忠诚与公平，善待每一个生命，踏实耐心，不追逐耀眼的光环，却永远是最可靠的后盾。",
    wand:"常见适配：梨木·独角兽毛、榛木·独角兽毛"
  },
  R:{
    name:"🦅 拉文克劳",
    title:"智慧、求知、好奇、独特",
    patronusPool:[
      "🦉猫头鹰","🦅鹰","🐬海豚","🦢天鹅","🐎飞马","🐈猫"
    ],
    desc:"欢迎来到拉文克劳。智慧不止是书本知识，更是好奇心、独立思考与接纳不同。你热爱探索、偏爱思考，享受解开谜题的快乐，拥有丰富深邃的精神世界。",
    wand:"常见适配：黑胡桃木·雷鸟羽毛、梧桐木·凤凰羽毛"
  },
  S:{
    name:"🐍 斯莱特林",
    title:"野心、智谋、自保、远见",
    patronusPool:[
      "🦢天鹅","🐍蛇","🐈‍⬛黑猫","🦊狐狸","🦌母鹿","🐺狼"
    ],
    desc:"你是斯莱特林。斯莱特林不等于邪恶，这里的人足智多谋、目标明确、懂得审时度势，重视自己的价值与所爱之人。你有野心，有远见，愿意为自己的目标默默努力。",
    wand:"常见适配：黑刺李木·龙心弦、山楂木·龙心弦"
  }
}

let current = 0
let score = {G:0,H:0,R:0,S:0}
let selected = null

// 检测是否已经测过
function checkDone(){
  if(localStorage.getItem('hogwarts_done')){
    showPage('alreadyDone')
    return true
  }
  return false
}
function startTest(){
  if(checkDone())return
  showPage('page0',false)
  renderQuestion()
}
function showPage(id, hideOthers=true){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'))
  if(hideOthers) document.getElementById(id).classList.add('active')
}
function renderQuestion(){
  const q = questions[current]
  const wrap = document.getElementById('questionWrap')
  let html = `<div class="page active" id="q${current}"><div class="card">`
  html += `<div class="question">${current+1}. ${q.q}</div>`
  q.o.forEach((opt,idx)=>{
    html += `<button class="opt" onclick="select(${idx})">${opt.txt}</button>`
  })
  html += `<button class="next-btn" id="nextBtn" onclick="next()">下一题</button>`
  html += `</div></div>`
  wrap.innerHTML = html
  selected = null
  document.getElementById('nextBtn').classList.remove('show')
}
function select(idx){
  selected = idx
  const q = questions[current]
  const k = q.o[idx].key
  score[k]++
  document.querySelectorAll('.opt').forEach((b,i)=>{
    b.style.background = i===idx ? 'rgba(124,92,255,0.4)' : 'rgba(40,44,75,0.6)'
  })
  document.getElementById('nextBtn').classList.add('show')
}
function next(){
  current++
  if(current >= questions.length){
    calcResult()
    return
  }
  renderQuestion()
}
function calcResult(){
  localStorage.setItem('hogwarts_done','1')
  // 找最高分学院
  let maxKey = 'G'
  let maxVal = 0
  for(let k in score){
    if(score[k]>maxVal){
      maxVal = score[k]
      maxKey = k
    }
  }
  const house = houseData[maxKey]
  // 随机选一个守护神
  const p = house.patronusPool[Math.floor(Math.random()*house.patronusPool.length)]
  document.getElementById('houseName').innerText = house.name
  document.getElementById('patronusName').innerText = `✨ 你的守护神：${p}`
  document.getElementById('descText').innerText = house.desc
  document.getElementById('wandText').innerText = house.wand
  showPage('resultPage')
}
function restart(){
  current=0
  score={G:0,H:0,R:0,S:0}
  selected=null
  showPage('page0')
}
function clearRecord(){
  localStorage.removeItem('hogwarts_done')
  restart()
}
// 初始化
window.onload=()=>{
  if(checkDone()) return
}
</script>
</body>
</html>
