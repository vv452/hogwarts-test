<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;

  body {
    min-height: 100vh;
    color: #fff;
    background:

    overflow-x: hidden;
    position: relative;
    padding: 24px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }

  /* 星空层 */
  .stars {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background-image:
      radial-gradient(1px 1px at 20% 30%, #ffffff 50%, transparent 51%),
      radial-gradient(1px 1px at 60% 70%, #ffffff 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 80% 20%, #ffe27a 50%, transparent 51%),
      radial-gradient(1px 1px at 40% 80%, #d9c8ff 50%, transparent 51%),
      radial-gradient(1px 1px at 90% 50%, #ffffff 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 10% 60%, #9fd2ff 50%, transparent 51%),
      radial-gradient(1px 1px at 35% 15%, #ffffff 50%, transparent 51%),
      radial-gradient(1px 1px at 70% 40%, #ffd777 50%, transparent 51%);
    opacity: 0.85;
  }

  /* 金色魔法线 */
  .gold-threads {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      linear-gradient(115deg, transparent 48%, rgba(255, 210, 110, 0.18) 49.5%, transparent 51%),
      linear-gradient(25deg, transparent 40%, rgba(255, 225, 150, 0.12) 41.5%, transparent 43%),
      linear-gradient(160deg, transparent 55%, rgba(255, 200, 90, 0.14) 56.5%, transparent 58%);
  }

  /* 低透明魔法图案（题目页 / 结果页通用） */
  .magic-patterns {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    opacity: 0.08;
    background-image:
      radial-gradient(circle at 15% 25%, #ffd777 0 2px, transparent 3px),
      radial-gradient(circle at 85% 35%, #c9b6ff 0 2px, transparent 3px),
      radial-gradient(circle at 35% 75%, #7fd1ff 0 2px, transparent 3px),
      radial-gradient(circle at 75% 85%, #ffd777 0 2px, transparent 3px),
      repeating-linear-gradient(45deg, rgba(255, 215, 120, 0.35) 0 1px, transparent 1px 14px),
      repeating-linear-gradient(-45deg, rgba(180, 160, 255, 0.25) 0 1px, transparent 1px 18px);
  }

  /* 漂浮粒子 */
  .particles {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background-image:
      radial-gradient(2px 2px at 25% 45%, rgba(255, 230, 150, 0.9), transparent 3px),
      radial-gradient(1.5px 1.5px at 65% 25%, rgba(210, 190, 255, 0.8), transparent 3px),
      radial-gradient(1px 1px at 50% 65%, rgba(255, 255, 255, 0.8), transparent 2px),
      radial-gradient(1.5px 1.5px at 15% 80%, rgba(170, 220, 255, 0.7), transparent 3px),
      radial-gradient(1px 1px at 85% 70%, rgba(255, 215, 120, 0.8), transparent 2px);
    animation: float 9s ease-in-out infinite alternate;
  }

  @keyframes float {
    from { transform: translateY(0) translateX(0); opacity: 0.75; }
    to { transform: translateY(-10px) translateX(6px); opacity: 1; }
  }

  /* 主体容器 */
  .container {
    position: relative;
    z-index: 10;
    max-width: 460px;
    width: 100%;
    margin: 0 auto;
    padding: 40px 0 56px;
  }

  .page {
    display: none;
    width: 100%;
  }
  .page.active {
    display: block;
  }

  .card {
    position: relative;
    z-index: 2;
    width: 100%;
    background: linear-gradient(145deg, rgba(18, 22, 50, 0.92), rgba(10, 14, 34, 0.92));
    border: 1px solid rgba(210, 180, 120, 0.32);
    border-radius: 22px;
    padding: 36px 28px;
    box-shadow:
      0 0 0 1px rgba(255, 215, 120, 0.08) inset,
      0 18px 60px rgba(0, 0, 0, 0.45),
      0 0 40px rgba(120, 90, 255, 0.18);
    backdrop-filter: blur(14px);
  }

  .card::before {
    content: "";
    position: absolute;
    inset: 10px;
    border-radius: 18px;
    border: 1px solid rgba(255, 215, 120, 0.12);
    pointer-events: none;
  }

  .title {
    font-size: 28px;
    text-align: center;
    color: #ffe9a8;
    letter-spacing: 2px;
    margin-bottom: 14px;
    text-shadow: 0 0 18px rgba(255, 215, 120, 0.45);

  .subtitle {
    text-align: center;
    color: #d9c8ff;
    font-size: 15px;
    line-height: 1.7;
    margin-bottom: 18px;

    height: 210px;
    margin: 18px 0 24px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .sorting-hat {
    position: relative;
    width: 180px;
    height: 190px;
    z-index: 3;
    filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.55));
  }

  .hat-svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .decor-wand {
    position: absolute;
    bottom: 40px;
    right: 28px;
    width: 110px;
    height: 10px;
    background: linear-gradient(90deg, #8a6a3a, #d7b57a 40%, #8a6a3a);
    border-radius: 10px;
    transform: rotate(-20deg);
    transform-origin: left center;
    box-shadow: 0 0 14px rgba(255, 215, 120, 0.55);
    z-index: 2;
  }

  .decor-wand::before {
    content: "";
    position: absolute;
    left: -10px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px;
    height: 18px;
    background: radial-gradient(circle, #fff3c4 0%, #ffd777 40%, transparent 70%);
    border-radius: 50%;
    animation: spark 2s ease-in-out infinite alternate;
  }

  @keyframes spark {
    from { opacity: 0.6; transform: translateY(-50%) scale(1); }
    to { opacity: 1; transform: translateY(-50%) scale(1.25); }
  }

  /* 封面介绍语 */
  .intro {
    color: #e6ddff;
    font-size: 15px;
    line-height: 1.8;
    text-align: center;
    margin-top: 12px;
  }

  .intro strong { color: #ffd777; }

  .primary-btn {
    width: 100%;
    padding: 16px;
    margin-top: 24px;
    border-radius: 14px;
    border: none;
    background: linear-gradient(135deg, #7c5cff, #5a3fd1);
    color: #fff;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 2px;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(124, 92, 255, 0.45);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .primary-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 14px 36px rgba(124, 92, 255, 0.6);
  }

  /* 题目区 */
  .question {
    font-size: 17px;
    line-height: 1.7;
    margin-bottom: 24px;
    color: #f5f1ff;
  }

  .opt {
    width: 100%;
    text-align: left;
    padding: 14px 16px;
    margin: 10px 0;
    border: 1px solid rgba(210, 190, 255, 0.3);
    border-radius: 12px;
    background: rgba(40, 44, 75, 0.6);
    color: #fff;
    font-size: 15px;
    cursor: pointer;
    transition: 0.2s;
  }

  .opt:hover {
    background: rgba(90, 70, 160, 0.4);
    border-color: #b8a1ff;
  }

  .next-btn {
    width: 100%;
    padding: 14px;
    margin-top: 20px;
    border-radius: 12px;
    border: none;
    background: #7c5cff;
    color: #fff;
    font-size: 16px;
    cursor: pointer;
    display: none;
  }

  .next-btn.show { display: block; }

  /* 结果页 */
  .result-box {
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .result-box .title {
    margin-bottom: 4px;
  }

  .house-tag {
    font-size: 26px;
    font-weight: bold;
    color: #ffe9a8;
    text-shadow: 0 0 16px rgba(255, 215, 120, 0.45);
  }

  .patronus {
    display: inline-block;
    align-self: center;
    font-size: 17px;
    color: #ffdd99;
    background: rgba(255, 215, 120, 0.12);
    border: 1px solid rgba(255, 215, 120, 0.25);
    border-radius: 999px;
    padding: 10px 18px;
    line-height: 1.4;
  }

  .desc {
    line-height: 1.8;
    color: #e2ddf4;
    font-size: 15px;
    text-align: left;
    background: rgba(40, 44, 75, 0.45);
    border-radius: 14px;
    padding: 18px 18px;
    white-space: pre-line;
  }

  .wand-info {
    color: #b8a1ff;
    font-size: 14px;
    line-height: 1.6;
    border-top: 1px solid rgba(180, 160, 255, 0.2);

    text-align: left;
    background: rgba(255, 215, 120, 0.08);
    border-left: 2px solid rgba(255, 215, 120, 0.4);
    border-radius: 10px;
    padding: 14px 16px;
  }

  .tip {
    margin-top: 18px;
    font-size: 12px;
    color: #aaa;
    text-align: center;
    line-height: 1.5;
  }

</style>
</head>

      title: "智慧、求知、好奇、独特",
      patronusPool: ["🦉猫头鹰", "🦅鹰", "🐬海豚", "🦢天鹅", "🐎飞马", "🐈猫"],
      desc: "欢迎来到拉文克劳。智慧不止是书本知识，更是好奇心、独立思考与接纳不同。你热爱探索、偏爱思考，享受解开谜题的快乐，拥有丰富深邃的精神世界。",
      blessing: "愿你永远保有这份好奇与思考，不盲从、不随波逐流。那些你独自琢磨过的问题、那些没人在意的冷门角落，终会带你去到别人到不了的地方。",
      wand: "常见适配：黑胡桃木·雷鸟羽毛、梧桐木·凤凰羽毛"
    },
    S: {
      name: "🐍 斯莱特林",
      title: "野心、智谋、自保、远见",
      patronusPool: ["🦢天鹅", "🐍蛇", "🐈‍⬛黑猫", "🦊狐狸", "🦌母鹿", "🐺狼"],
      desc: "你是斯莱特林。斯莱特林不等于邪恶，这里的人足智多谋、目标明确、懂得审时度势，重视自己的价值与所爱之人。你有野心，有远见，愿意为自己的目标默默努力。",
      blessing: "愿你既守得住自己的目标，也留得住心底的温柔。你谋划前路、步步为营的同时，也请记得善待那个一直努力的自己；你在乎的人，值得你收起锋芒、认真守护。",
      wand: "常见适配：黑刺李木·龙心弦、山楂木·龙心弦"
    }
  };

  let current = 0;
  let score = { G: 0, H: 0, R: 0, S: 0 };
  let selected = null;

  const STORE_KEY = 'hw_result';

  function saveResult(key, patronus) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify({ house: key, patronus: patronus })); } catch (e) {}
  }

  function loadResult() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      const data = raw ? JSON.parse(raw) : null;
      if (data && houseData[data.house]) return data;
    } catch (e) {}
    return null;
  }

  function fillResult(key, patronus) {
    const house = houseData[key];
    document.getElementById('houseName').innerText = house.name;
    document.getElementById('patronusName').innerText = '✨ 你的守护神：' + patronus;
    document.getElementById('descText').innerText = house.desc;
    document.getElementById('wandText').innerText = house.wand;
    document.getElementById('blessingText').innerText = house.blessing;
  }

  function resetResult() {
    document.getElementById('houseName').innerText = '分院结果生成中…';
    document.getElementById('patronusName').innerText = '';
    document.getElementById('descText').innerText = '';
    document.getElementById('wandText').innerText = '';
    document.getElementById('blessingText').innerText = '';
  }

  function startTest() {
    current = 0;
    score = { G: 0, H: 0, R: 0, S: 0 };
    selected = null;
    renderQuestion();
  }

  function showPage(id) {
    document.querySelectorAll('.page').forEach(p => {
      p.classList.remove('active');
      p.style.display = '';
    });
    const el = document.getElementById(id);
    if (el) {
      el.style.display = '';
      el.classList.add('active');
    }
  }

  function renderQuestion() {
    const q = questions[current];
    const wrap = document.getElementById('questionWrap');
    let html = '<div class="page active" id="q' + current + '"><div class="card">';
    html += '<div class="question">' + (current + 1) + '. ' + q.q + '</div>';
    q.o.forEach(function (opt, idx) {
      html += '<button class="opt" onclick="select(' + idx + ')">' + opt.txt + '</button>';
    });
    html += '<button class="next-btn" id="nextBtn" onclick="next()">下一题</button>';
    html += '</div></div>';
    wrap.innerHTML = html;
    selected = null;
    document.getElementById('nextBtn').classList.remove('show');
  }

  function select(idx) {
    selected = idx;
    const q = questions[current];
    const k = q.o[idx].key;
    score[k]++;
    document.querySelectorAll('.opt').forEach(function (b, i) {
      b.style.background = i === idx ? 'rgba(124,92,255,0.4)' : 'rgba(40,44,75,0.6)';
    });
    document.getElementById('nextBtn').classList.add('show');
  }

  function next() {
    current++;
    if (current >= questions.length) {
      calcResult();
      return;
    }
    renderQuestion();
  }

  function calcResult() {
    let maxKey = 'G';
    let maxVal = 0;
    for (let k in score) {
      if (score[k] > maxVal) {
        maxVal = score[k];
        maxKey = k;
      }
    }

    const house = houseData[maxKey];
    const p = house.patronusPool[Math.floor(Math.random() * house.patronusPool.length)];

    fillResult(maxKey, p);
    saveResult(maxKey, p);
    showPage('resultPage');
  }

  // 打开页面：已有结果则直接回到结果页，否则进入封面
  function init() {
    const saved = loadResult();
    if (saved) {
      fillResult(saved.house, saved.patronus || houseData[saved.house].patronusPool[0]);
      showPage('resultPage');
    } else {
      resetResult();
      showPage('page0');
    }
  }

  document.addEventListener('DOMContentLoaded', init);

</script>

</body>
</html>
